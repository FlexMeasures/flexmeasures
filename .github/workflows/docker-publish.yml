
# This workflow builds and pushes a Docker image to Docker Hub whenever a GitHub Release is published,
# tagging it with the release version and, for the newest stable (non-pre-release) release, also as `latest`.
#
# Requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets
# to be configured under Settings -> Secrets and variables -> Actions.

name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build/push (e.g. v1.0.0). Required when run manually."
        required: false
      latest:
        description: "Also push as `latest`. Only tick this when re-running a stable release; never for a pre-release. Ignored unless the tag is the newest stable release."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: dockerhub
    steps:
      - name: Determine version and image tags
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag available (release.tag_name and inputs.tag are both empty)." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # The PEP 440 version expected in the installed package metadata.
          # Git tags carry a leading `v` that hatch-vcs strips from the version.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # `github.event.release.prerelease` is a boolean field GitHub sets
          # on the `release` webhook payload, reflecting whether the "Set as
          # a pre-release" checkbox was ticked when the GitHub Release was
          # created. We only want stable releases to also claim `:latest`.
          #
          # On `workflow_dispatch` there is no release payload at all, so that
          # field renders as an empty string -- which would sail past a bare
          # `!= "true"` check and clobber `:latest` with a manually built image.
          # Hence the explicit event check, with an opt-in input to keep the
          # documented "re-run a stable release" path working.
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              PUSH_LATEST=false
            else
              PUSH_LATEST=true
            fi
          else
            PUSH_LATEST="${{ inputs.latest }}"
          fi
          echo "push-latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0 # full history + tags, required for hatch-vcs to resolve the version

      - name: Determine image tags
        id: tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUSH_LATEST: ${{ steps.version.outputs.push-latest }}
        run: |
          # Only the newest stable release may claim `latest`.
          # A patch release on an older line (e.g. v1.0.3, published alongside v1.1.2) is stable too,
          # and whichever of the two publish runs finished last used to win `latest` (both ran on November 23, 2026, and v1.0.3 won).
          # This also refuses a manual run with `latest` ticked for a tag that is no longer the newest release.
          NEWEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$PUSH_LATEST" = "true" ] && [ "$TAG" != "$NEWEST" ]; then
            echo "::notice::Not pushing ${TAG} as latest, because ${NEWEST} is the newest release."
            PUSH_LATEST=false
          fi

          IMAGE_TAGS="lfenergy/flexmeasures:${TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            IMAGE_TAGS="${IMAGE_TAGS}
          lfenergy/flexmeasures:latest"
          fi
          {
            echo "image-tags<<EOF"
            echo "$IMAGE_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        # Built once, pushed under both tags: pushing `latest` re-tags the
        # exact image just built and pushed under the version tag, rather
        # than triggering a second (functionally identical, but distinct)
        # build.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.image-tags }}
          build-args: |
            FLEXMEASURES_VERSION=${{ steps.version.outputs.version }}

      - name: Verify the version baked into the image
        # The UI footer and FlexMeasures-Version response header read this
        # metadata. Verify that hatch-vcs derived the release tag as expected.
        run: |
          BAKED=$(docker run --rm "lfenergy/flexmeasures:${{ steps.version.outputs.tag }}" \
            python -c "from importlib.metadata import version; print(version('flexmeasures'))")
          echo "Image reports version: ${BAKED}"
          if [ "$BAKED" != "${{ steps.version.outputs.version }}" ]; then
            echo "Expected ${{ steps.version.outputs.version }}, got ${BAKED}." >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.tags.outputs.image-tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
