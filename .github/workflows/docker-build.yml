name: build-docker-image

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    services:
      postgres:
        env:
          POSTGRES_DB: flexmeasures_test
          POSTGRES_PASSWORD: flexmeasures_test
          POSTGRES_USER: flexmeasures_test
        image: postgres:latest
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout flexmeasures-client
        uses: actions/checkout@v4
        with:
          repository: FlexMeasures/flexmeasures-client
          ref: main
          path: flexmeasures-client
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Build Docker Image
        run: docker build -t flexmeasures:latest -f Dockerfile .
      - name: Generate random secret key
        run:
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          >> .env
      - name: Generate random totp secret
        run: echo "SECURITY_TOTP_SECRETS={\"1\":\"$(python3 -c 'import secrets; print(secrets.token_hex(24))')\"}" >> .env
      - name: Export SQLALCHEMY_DATABASE_URI
        run:
          echo "SQLALCHEMY_DATABASE_URI=postgresql://flexmeasures_test:flexmeasures_test@127.0.0.1:5432/flexmeasures_test"
          >> .env
      - name: Write a config file for the container's instance folder
        run: |
          mkdir -p ci-instance
          echo 'FLEXMEASURES_PLATFORM_NAME = "Docker build check"' > ci-instance/flexmeasures.cfg
      - name: Keep running flexmeasures container in background
        run: docker run -t -d --env-file .env --network=host -v "$PWD/ci-instance:/app/instance:ro" --name fm-container flexmeasures:latest
      - name: Check that the image serves the UI's libraries itself
        run: docker exec fm-container python -c
          "from flexmeasures.ui.utils.vendor_assets import missing_files; assert not missing_files(), missing_files()"
      - name: Execute database upgrade
        run: docker exec --env-file .env fm-container flexmeasures
          db upgrade
      - name: Check the image's server, config and pip
        run: |
          # Answer a few requests at once, so that more than one gunicorn worker serves them.
          pids=()
          for i in $(seq 8); do curl --silent --fail --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:5000/api/ops/ping > /dev/null & pids+=($!); done
          # Wait for each request by its PID, as a bare `wait` would succeed even if requests failed.
          for pid in "${pids[@]}"; do wait "$pid"; done
          # Gunicorn's own logging survives the app configuring its logging (#2512 preloads the app in gunicorn's arbiter).
          docker logs fm-container 2>&1 | grep -q "Booting worker" || { echo "::error::Gunicorn logged nothing about its workers."; exit 1; }
          # The config mounted at /app/instance is read, by the server and by the CLI.
          if docker logs fm-container 2>&1 | grep -q "flexmeasures.cfg could not be found"; then echo "::error::The server did not find the config mounted at /app/instance."; exit 1; fi
          docker exec fm-container python -c "from flexmeasures.app import create; name = create().config['FLEXMEASURES_PLATFORM_NAME']; assert name == 'Docker build check', name"
          # pip installs into the virtual environment that FlexMeasures runs from.
          docker exec fm-container sh -c 'pip --version' | grep -q "/app/.venv/" || { echo "::error::pip does not install into FlexMeasures' virtual environment."; exit 1; }
      - name: Add toy user
        run: docker exec --env-file .env fm-container flexmeasures
          add toy-account --kind battery --shell-vars | grep '^FM_TOY_' >> $GITHUB_ENV
      - name: Run data-ingestion tutorial
        env:
          FLEXMEASURES_CLIENT_PROJECT: ${{ github.workspace }}/flexmeasures-client
        run: ./documentation/tut/scripts/run-data-ingestion-in-docker.sh fm-container
      - name: Generate prices dummy data
        run: ci/generate-dummy-price.sh
      - name: Copy prices dummy data
        run: docker cp prices-tomorrow.csv fm-container:/app/prices-tomorrow.csv
      - name: Add beliefs
        run: |
          docker exec --env-file .env fm-container flexmeasures \
            add beliefs --sensor ${FM_TOY_PRICE_SENSOR_ID} --source toy-user prices-tomorrow.csv --timezone Europe/Amsterdam --unit EUR/MWh
      - name: Export TOMORROW
        run: echo "TOMORROW=$(date --date="next day" '+%Y-%m-%d')"
          >> $GITHUB_ENV
      - name: Add schedule
        run: |
          docker exec --env-file .env fm-container flexmeasures \
            add schedule --sensor ${FM_TOY_BATTERY_SENSOR_ID} --start ${TOMORROW}T07:00+01:00 \
            --duration PT12H --soc-at-start 50% --flex-model '{"roundtrip-efficiency": "90%"}'
      - name: Add Toy Account for process
        run: docker exec --env-file .env fm-container flexmeasures add toy-account --kind process --shell-vars | grep '^FM_TOY_' >> $GITHUB_ENV
      - name: Add Process schedule
        run: |
          docker exec --env-file .env fm-container flexmeasures add schedule --sensor ${FM_TOY_PROCESS_BREAKABLE_SENSOR_ID} --scheduler ProcessScheduler \
            --start ${TOMORROW}T00:00:00+02:00 --duration PT24H --flex-context '{"consumption-price": {"sensor": '"${FM_TOY_PRICE_SENSOR_ID}"'}}' \
            --flex-model "{\"duration\": \"PT4H\", \"process-type\": \"BREAKABLE\", \"power\": 200, \"time-restrictions\": [{\"start\": \"${TOMORROW}T15:00:00+02:00\", \"duration\": \"PT1H\"}]}"
