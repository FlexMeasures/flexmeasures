# A generic, single database configuration.

[alembic]
# Only current (post-squash) revision tree is on default path.
# Legacy tree lives in versions_legacy/, put on path only by orchestration in
# flexmeasures/data/utils.py, when existing DB still needs it.
version_locations = %(here)s/versions_current

# Silences Alembic 1.18+ warning about splitting version_locations on spaces/commas.
path_separator = os

# Timestamp prefix keeps last filename in sorted order as head, so head is
# readable without importing any revision module.
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Create dates in filename must not depend on contributor's local zone.
timezone = UTC

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
