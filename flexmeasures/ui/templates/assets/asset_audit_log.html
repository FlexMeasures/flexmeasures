{% extends "base.html" %}

{% set active_page = "assets" %}

{% block title %} {{asset.name}} {% endblock %}

{% block divs %}
{% block breadcrumbs %} {{ super() }} {% endblock %}

<div class="container-fluid px-0">
    <div class="row gx-0">
        <div class="col-sm-2"></div>
        <div class="col-sm-8 asset auditlog card">
            <h3>History of actions for asset <a href="/assets/{{ asset.id }}">{{ asset.name }}</a></h3>
            <table id="assetAuditLog" class="table table-striped paginate">
            </table>
        </div>
        <div class="col-sm-2"></div>
    </div>
</div>

<script type="module">
    import { initAuditLogTable } from "{{ url_for('flexmeasures_ui.static', filename='js/audit-log.js') }}?v={{ flexmeasures_version }}";
    // Event texts are rendered as text, as they hold names and plugin messages (see audit-log.js).
    initAuditLogTable("#assetAuditLog", "/api/v3_0/assets/{{ asset.id }}/auditlog");
</script>

{% endblock %}
