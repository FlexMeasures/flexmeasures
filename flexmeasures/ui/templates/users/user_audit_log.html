{% extends "base.html" %}

{% set active_page = "users" %}

{% block title %} User {{ user.username }} {% endblock %}

{% block divs %}

<div class="container-fluid">
    <div class="row">
        <div class="sensors-asset card">
            <h3>History of actions for user <a href="/users/{{ user.id }}">{{ user.username }}</a></h3>
            <div class="table-responsive">
                <table id="userAuditLog" class="table table-striped paginate nav-on-click" title="View data">
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initAuditLogTable } from "{{ url_for('flexmeasures_ui.static', filename='js/audit-log.js') }}?v={{ flexmeasures_version }}";
    // Event texts are rendered as text, as they hold names and plugin messages (see audit-log.js).
    initAuditLogTable("#userAuditLog", "/api/v3_0/users/{{ user.id }}/auditlog",
        (request) => {
            const response = JSON.parse(request.responseText);  // TODO: show all errors with message. not just 422
            const toastMessage = request.status === 422
                ? "Error calling the audit log endpoint."
                + JSON.stringify(response.message) : "Something went wrong!";
            showToast(toastMessage, "error");
        }
    );
</script>

{% endblock %}
